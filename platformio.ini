[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.0
build_flags =
  -DUSER_SETUP_LOADED=1
  -DILI9488_DRIVER=1
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DTFT_MOSI=32
  -DTFT_SCLK=18
  -DTFT_MISO=-1
  -DTFT_CS=26
  -DTFT_RST=25
  -DTFT_DC=33
  -DLOAD_GFXFF=1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=27000000
  -DSPI_TOUCH_FREQUENCY=2500000
